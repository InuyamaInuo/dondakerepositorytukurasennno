<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>食材を編集</title>
</head>

<body>

	<h1>食材を編集</h1>

	<form th:action="@{/fridge/update}" th:object="${foodItem}" method="post">
		<!-- ID(表示しない) -->
		<input type="hidden" th:field="*{id}" />

		<label>食材名：</label>
		<input type="text" th:field="*{name}" required /><br />

		<label>カテゴリー：</label>
		<select th:field="*{category}" id="category" onchange="updateCategoryAndUnit()">
			<option value="生肉、生魚">生肉、生魚</option>
			<option value="野菜">野菜</option>
			<option value="加工品">加工品(豆腐、納豆とか)</option>
			<option value="卵">卵</option>
			<option value="その他">その他(自由入力できます)
			</option>
		</select><br />

		<!-- その他カテゴリの入力欄（最初は非表示） -->
		<div id="otherCategoryFields" style="display: none; margin-top: 10px;">
			<label>カテゴリ名:</label>
			<input type="text" th:field="*{customCategory}" /><br />

			<label>賞味期限までの日数:</label>
			<input type="number" name="customDaysToExpire" id="customDaysToExpire" min="0" disabled /><br />
		</div>

		<label>量：</label>
		<input type="number" th:field="*{quantity}" id="quantityInput" required min="0" />
		<span id="unit">g</span><br />

		<label>購入日：</label>
		<input type="date" th:field="*{purchaseDate}" required /><br />

		<label>冷凍：</label>
		<input type="checkbox" th:field="*{frozen}" /><br />

		<button type="submit">登録</button>
	</form>

	<br><br>
	<a th:href="@{/fridge/list}">←一覧に戻る</a>
	
	<script>
		function updateCategoryAndUnit() {
			const category = document.getElementById("category").value;
			const unit = document.getElementById("unit");
			const otherFields = document.getElementById("otherCategoryFields");

			// 単位の更新
			if (category === "生肉、生魚" || category === "野菜") {
				unit.textContent = "g";
			} else {
				unit.textContent = "個";
			}

			// 「その他」が選ばれたら自由入力欄を表示
			if (category === "その他") {
				otherFields.style.display = "block";
				document.getElementById("customDaysToExpire").disabled = false;
				document.getElementsByName("customCategory")[0].disabled = false;
			} else {
				otherFields.style.display = "none";
				document.getElementById("customDaysToExpire").disabled = true;
				document.getElementsByName("customCategory")[0].disabled = true;
			}
		}

		// ページ読み込み時にもチェック
		window.onload = updateCategoryAndUnit;
	</script>

</body>

</html>
